<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; script-src 'self'; connect-src http: https:;">
<title>Our Benchmark — 大模型跑分实验室</title>
<link rel="stylesheet" href="css/fonts-sans.css">
<link rel="stylesheet" href="css/fonts-serif.css">
<link rel="stylesheet" href="css/fonts-mono.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/motion.css">
</head>
<body>
<div class="app">
  <!-- ── 侧栏：L 型框架的竖边 ─────────────────────────────── -->
  <aside class="sidebar">
    <div class="brand" id="brand" role="button" tabindex="0" aria-label="返回首页">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 28 28" width="28" height="28" fill="none">
          <rect x="1.25" y="1.25" width="25.5" height="25.5" rx="6" stroke="currentColor" stroke-width="1.3"/>
          <path d="M14 7.5v13M7.5 14h13" stroke="currentColor" stroke-width="1.1" opacity=".55"/>
          <circle cx="14" cy="14" r="4.1" stroke="currentColor" stroke-width="1.3"/>
          <circle cx="14" cy="14" r="1.5" fill="var(--accent)"/>
        </svg>
      </span>
      <span class="brand-text">
        <b>Our Benchmark</b>
        <span>大模型跑分实验室</span>
      </span>
    </div>

    <nav class="nav" aria-label="主导航">
      <div class="nav-group">
        <div class="nav-label">工作台</div>
        <button class="nav-link" data-page="home" aria-current="page">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 8.5 10 3l6.5 5.5V16a1 1 0 0 1-1 1h-3.2v-4.2H7.7V17H4.5a1 1 0 0 1-1-1z"/></svg>
          <span>首页</span>
        </button>
        <button class="nav-link" data-page="run">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 15.5V11m4 4.5V7.5m4 8V9m4 6.5V4.5"/></svg>
          <span>开始跑分</span>
        </button>
        <button class="nav-link" data-page="leaderboard">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 16.5h13M5.5 16.5v-5h3v5m3 0v-9h3v9m3 0v-13h-3"/></svg>
          <span>全球榜单</span>
        </button>
      </div>
      <div class="nav-group">
        <div class="nav-label">社区</div>
        <button class="nav-link" data-page="forum">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 5.5A1.5 1.5 0 0 1 5 4h10a1.5 1.5 0 0 1 1.5 1.5v6A1.5 1.5 0 0 1 15 13H8.8l-3.6 3v-3H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
          <span>社区论坛</span>
        </button>
        <button class="nav-link" data-page="history">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5"/><path d="M10 6.2V10l2.6 1.6"/></svg>
          <span>我的记录</span>
        </button>
      </div>
      <div class="nav-group">
        <div class="nav-label">系统</div>
        <button class="nav-link" data-page="device">
          <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5.5" y="5.5" width="9" height="9" rx="1.4"/><path d="M8 2.5v3m4-3v3m-4 9v3m4-3v3M2.5 8h3m-3 4h3m9-4h3m-3 4h3"/></svg>
          <span>设备信息</span>
        </button>
        <button class="nav-link" data-page="settings">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M4 10h12M4 14h12"/><circle cx="7" cy="6" r="1.6" fill="var(--sheet)"/><circle cx="13" cy="10" r="1.6" fill="var(--sheet)"/><circle cx="8.5" cy="14" r="1.6" fill="var(--sheet)"/></svg>
          <span>设置</span>
        </button>
      </div>
    </nav>

    <div class="sidebar-foot">
      <div class="server-line" id="serverDot">
        <span class="dot"></span><span id="serverDotText">检测服务器</span>
      </div>
      <button class="account" id="accountBtn" aria-label="账户">
        <span class="account-avatar" id="accountAvatar">访</span>
        <span class="account-text"><b id="accountName">访客</b><span id="accountSub">未登录</span></span>
        <svg class="account-chev" viewBox="0 0 20 20" aria-hidden="true"><path d="m8 12 4-4 4 4" transform="rotate(90 10 10)"/></svg>
      </button>
      <div class="sidebar-meta"><span>v1.0.0</span><span>本地优先</span></div>
    </div>
  </aside>

  <!-- ── 工作区：顶栏 + 纸张 ───────────────────────────────── -->
  <div class="workspace">
    <header class="topbar">
      <div class="crumb">
        <span id="crumbGroup">工作台</span>
        <span class="crumb-sep">/</span>
        <b id="crumbPage">首页</b>
      </div>
      <div class="topbar-mid">
        <span class="pulse" aria-hidden="true"></span>
        <span id="topbarStatus">本地引擎就绪</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="refreshBtn" title="刷新当前页" aria-label="刷新当前页">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5V7h-3.5"/></svg>
        </button>
        <button class="btn btn-outline btn-sm" id="loginBtn">GitHub 登录</button>
        <div class="user-chip hidden" id="userChip" role="button" tabindex="0">
          <img id="userAvatar" alt="">
          <span id="userName">游客</span>
        </div>
        <div class="win-controls">
          <button class="wc" id="wcMin" title="最小化" aria-label="最小化">&minus;</button>
          <button class="wc" id="wcMax" title="最大化" aria-label="最大化">&#9633;</button>
          <button class="wc wc-close" id="wcClose" title="关闭" aria-label="关闭">&times;</button>
        </div>
      </div>
    </header>

    <main class="sheet" id="sheet">
      <div class="vt-line" aria-hidden="true"></div>
      <div class="view" id="view"></div>
    </main>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>
<div id="overlay-root"></div>

<script src="js/core.js"></script>
<script src="js/fx.js"></script>
<script src="js/charts.js"></script>
<script src="js/pages/home.js"></script>
<script src="js/pages/run.js"></script>
<script src="js/pages/leaderboard.js"></script>
<script src="js/pages/forum.js"></script>
<script src="js/pages/history.js"></script>
<script src="js/pages/device.js"></script>
<script src="js/pages/settings.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
